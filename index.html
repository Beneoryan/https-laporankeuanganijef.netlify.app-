<script id="safe-json-stringify-polyfill">
(function() {
  var nativeStringify = JSON.stringify;
  JSON.stringify = function(value, replacer, space) {
    var seen = [];
    function safeReplacer(key, val) {
      if (val && typeof val === 'object') {
        if (seen.indexOf(val) !== -1) { return '[Circular]'; }
        seen.push(val);
      }
      return typeof replacer === 'function' ? replacer(key, val) : val;
    }
    try { return nativeStringify(value, safeReplacer, space); } catch (e) { return '"[Unserializable]"'; }
  };
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Sistem Keuangan IJEF Corp</title>

<style>
:root {
  --ijef-primary: #a30000;
  --ijef-primary-hover: #800000;
  --ijef-primary-light: #fef2f2;
  --ijef-dark: #111115;
  --ijef-dark-hover: #1e1e24;
  --ijef-sidebar: #0f0f12;
  --ijef-bg: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  background-color: var(--ijef-bg);
  font-family: 'Inter', sans-serif;
  color: #333;
  font-size: 14px;
  overflow-x: hidden;
  overflow-y: auto !important;
}

/* LOADING OVERLAY */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.9);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 15px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #f3f3f3;
  border-top: 5px solid var(--ijef-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* APP WRAPPER */
#viewport-wrapper {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* LOGIN */
#login-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #241414 0%, #0a0606 100%);
  z-index: 5000;
  padding: 20px;
}
.login-box {
  background: white;
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-logo { text-align: center; margin-bottom: 25px; }
#login-logo-container { width: 100px; height: 100px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; }
#login-logo-container img { max-width: 100%; max-height: 100%; border-radius: 12px; }

/* HEADER */
.app-header {
  background: var(--ijef-dark);
  color: white;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 2000;
  border-bottom: 2px solid var(--ijef-primary);
  height: 56px;
}

/* SIDEBAR */
.app-body { display: flex; flex: 1; position: relative; }
.sidebar {
  width: 240px;
  background: var(--ijef-sidebar);
  color: white;
  flex-shrink: 0;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
  transition: all 0.3s ease;
  z-index: 1500;
}
.sidebar.collapsed { width: 0; overflow: hidden; }

/* SIDEBAR STYLING (PRECISE) */
.sidebar-group { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.sidebar-group-title {
  font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.4);
  padding: 10px 20px; text-transform: uppercase; letter-spacing: 1px;
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
}
.sidebar-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 20px;
  cursor: pointer; font-size: 0.9rem; color: rgba(255,255,255,0.7);
  transition: all 0.2s; border-left: 4px solid transparent;
}
.sidebar-item:hover { background: rgba(255,255,255,0.08); color: white; }
.sidebar-item.active { background: rgba(163,0,0,0.15); border-left-color: var(--ijef-primary); color: white; font-weight: 600; }
.sidebar-item .icon { font-size: 1.1rem; width: 24px; text-align: center; }

.sidebar-submenu { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; background: rgba(0,0,0,0.3); }
.sidebar-subgroup.expanded > .sidebar-submenu { max-height: 1000px; }
.sidebar-item.sub { padding-left: 40px; font-size: 0.85rem; }
.sidebar-sub-arrow { font-size: 0.6rem; transition: transform 0.3s; color: rgba(255,255,255,0.3); }
.sidebar-subgroup.expanded .sidebar-sub-arrow { transform: rotate(90deg); }

/* MAIN CONTENT */
.main-content { flex: 1; padding: 30px; min-width: 0; background: var(--ijef-bg); min-height: 100%; }
.section { display: none; }
.section.active { display: block; }

/* DASHBOARD CARDS & GRIDS */
.card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1.5px solid #f1f5f9; }
.card-header h2 { color: var(--ijef-primary); font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
.stat-box { background: white; border-radius: 14px; padding: 24px; border-left: 5px solid var(--ijef-primary); border: 1px solid #e2e8f0; }
.stat-box.green { border-left-color: #10b981; }
.stat-box.red { border-left-color: #f43f5e; }
.stat-box .val-large { font-size: 2rem; font-weight: 800; color: var(--ijef-primary); line-height: 1.2; }
.stat-box.green .val-large { color: #10b981; }
.stat-box .lbl { font-size: 0.8rem; color: #64748b; margin-top: 6px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

.saldo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
.saldo-card-val { font-size: 1.25rem !important; font-weight: 700; }

/* RESPONSIVE */
@media (max-width: 1024px) {
  .sidebar { position: fixed; left: 0; transform: translateX(-100%); box-shadow: none; }
  .sidebar.mobile-open { transform: translateX(0); box-shadow: 15px 0 40px rgba(0,0,0,0.4); }
}
@media (max-width: 600px) {
  .main-content { padding: 15px; padding-bottom: 100px !important; }
  .user-info { display: none; }
  .stats-row { grid-template-columns: 1fr; }
}

/* MOBILE BOTTOM NAV */
#app-bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 68px; background: var(--ijef-dark); border-top: 3px solid var(--ijef-primary);
  z-index: 2000; justify-content: space-around; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
}
@media (max-width: 768px) { #app-bottom-nav { display: flex; } }

/* BUTTONS & UTILS */
.btn { padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
.btn-primary { background: var(--ijef-primary); color: white; }
.btn-primary:hover { background: var(--ijef-primary-hover); }
.btn-outline { background: white; border: 2px solid var(--ijef-primary); color: var(--ijef-primary); }
.text-green { color: #10b981 !important; }
.text-red { color: #f43f5e !important; }
.fw-bold { font-weight: 700 !important; }
.text-right { text-align: right !important; }
.alert { padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 15px; border-left: 5px solid transparent; }
.alert-info { background: #eff6ff; color: #1e40af; border-left-color: #3b82f6; }
.alert-warning { background: #fff8e1; color: #e65100; border-left-color: #ff9800; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 18px; padding: 30px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; }

/* ORIENTATION CLASSES */
body.orientation-landscape .sidebar { position: fixed; left: 0; transform: translateX(-100%); }
body.orientation-landscape .sidebar.mobile-open { transform: translateX(0); }
</style>
</head>

<script>
// Orientation & Resize Handler
function handleResize() {
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.remove('orientation-portrait', 'orientation-landscape');
  document.body.classList.add(isPortrait ? 'orientation-portrait' : 'orientation-landscape');
  
  if (window.innerWidth <= 600) {
    document.body.classList.add('preview-mode-mobile');
    document.body.classList.remove('preview-mode-tablet', 'preview-mode-desktop');
  } else if (window.innerWidth <= 1024) {
    document.body.classList.add('preview-mode-tablet');
    document.body.classList.remove('preview-mode-mobile', 'preview-mode-desktop');
  } else {
    document.body.classList.add('preview-mode-desktop');
    document.body.classList.remove('preview-mode-mobile', 'preview-mode-tablet');
  }
  
  window.dispatchEvent(new Event('resize-charts'));
}

window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(handleResize, 400));

window.addEventListener('load', function() {
  handleResize();
  
  // AUTO-FIX BALANCE FOR MANDIRI
  setTimeout(async function() {
    try {
      if (window.KU && window.KU.username === 'superadmin') {
        const targetVal = 102817055.37;
        if (window.getStoredBankActualBalances && window.saveStoredBankActualBalance) {
          const balances = await window.getStoredBankActualBalances(['1-1101-2']);
          const current = parseFloat(balances['1-1101-2']) || 0;
          if (Math.abs(current - targetVal) > 0.01) {
            await window.saveStoredBankActualBalance('1-1101-2', targetVal);
            if (typeof buildApp === 'function') await buildApp();
          }
        }
      }
    } catch(e) { console.error('Balance auto-fix error:', e); }
    // Final check to hide system loader
    const loader = document.getElementById('loading-overlay');
    if (loader && loader.classList.contains('show')) loader.classList.remove('show');
  }, 3000);
});

function togglePwd(id, btn) {
  var x = document.getElementById(id);
  if (x.type === "password") { x.type = "text"; btn.innerText = "🙈"; }
  else { x.type = "password"; btn.innerText = "👁"; }
}
</script>
